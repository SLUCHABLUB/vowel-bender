[workspace]
members = ["crates/vowel-bender", "crates/vowel-bender-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
vowel-bender = { path = "crates/vowel-bender" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display"] }
encoding_rs = "0.8.42"
fn-error-context = "0.2.1"
fs-err = "3.3.2"
hound = "3.5.1"
num-complex = "0.4.6"
rand = { version = "0.10.3", default-features = false }
rand_xoshiro = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "0.8.23"

[workspace.lints.clippy]
pedantic.level = "deny"
pedantic.priority = -1
